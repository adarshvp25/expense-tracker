<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1 class="title">Expense Tracker</h1>

        <!-- Summary Cards -->
        <section class="summary">

            <div class="summary-card balance">
                <h3>Total Balance</h3>
                <p id="balance">₹0</p>
            </div>

            <div class="summary-card income">
                <h3>Total Income</h3>
                <p id="income">₹0</p>
            </div>

            <div class="summary-card expense">
                <h3>Total Expenses</h3>
                <p id="expenses">₹0</p>
            </div>

        </section>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Add Transaction Form -->
            <section class="form-section">

                <h2>Add Transaction</h2>

                <form id="transaction-form">

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Grocery shopping" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category">
                                <option value="General">General</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Salary">Salary</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                    </div>

                    <button type="submit" class="add-btn">
                        Add Transaction
                    </button>

                </form>

            </section>

            <!-- Transactions List -->
            <section class="transactions-section">

                <h2>Transactions</h2>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="transaction-list">
                            <!-- JavaScript will add transactions here -->
                        </tbody>
                    </table>
                </div>

                <p id="empty-message" class="empty-message">
                    No transactions yet.
                </p>

            </section>

        </main>

    </div>

    <script src="script.js"></script>
</body>

</html>
